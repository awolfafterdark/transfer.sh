name: Host Transfer.sh with previews
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transfer-ngrok-host
  cancel-in-progress: true
env:
  RUNTIME_MINUTES: "330"
  NGROK_DOMAIN: ${{ vars.NGROK_DOMAIN || 'nondurable-tabetha-cellular.ngrok-free.dev' }}
  TRANSFER_TEMPORARY_HOSTING: "true"
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
      - name: Clone pinned official server and apply customizations
        run: |
          git clone https://github.com/dutchcoders/transfer.sh.git official
          git -C official checkout --detach f040f28df9fd139e7717af7eaa4c055870ab8339
          bash custom/scripts/apply-customizations.sh "$GITHUB_WORKSPACE/official"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: official/go.sum
      - name: Build and test modified Go server
        working-directory: official
        run: |
          gofmt -w server/share.go server/share_test.go server/server.go server/handlers.go
          go vet ./...
          go test ./...
          go build -o "$RUNNER_TEMP/transfer" .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests and ngrok
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser-tests/node_modules" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o "$RUNNER_TEMP/ngrok.tgz"
          tar -xzf "$RUNNER_TEMP/ngrok.tgz" -C "$RUNNER_TEMP" ngrok
      - name: Start server with temporary local storage
        run: |
          mkdir -p "$RUNNER_TEMP/transfer-data" "$RUNNER_TEMP/transfer-tmp"
          "$RUNNER_TEMP/transfer" --provider local --basedir "$RUNNER_TEMP/transfer-data" --temp-path "$RUNNER_TEMP/transfer-tmp" --listener 127.0.0.1:8080 --web-path "$GITHUB_WORKSPACE/official/server/web" > "$RUNNER_TEMP/transfer.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/transfer.pid"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/health.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          test -n "$NGROK_AUTHTOKEN" || { echo 'Set the NGROK_AUTHTOKEN repository secret.' >&2; exit 1; }
          "$RUNNER_TEMP/ngrok" http --domain="$NGROK_DOMAIN" --log=stdout --log-format=json 8080 > "$RUNNER_TEMP/ngrok.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ngrok.pid"
          for i in {1..60}; do
            if curl -fsS -H 'ngrok-skip-browser-warning: integration-test' "https://$NGROK_DOMAIN/health.html"; then exit 0; fi
            kill -0 "$(cat "$RUNNER_TEMP/ngrok.pid")" || exit 1
            sleep 2
          done
          exit 1
      - name: Verify local API and complete browser upload flow
        working-directory: custom
        run: |
          python3 tests/api_test.py
          node tests/browser.cjs
      - name: Verify public tunnel and browser upload flow
        working-directory: custom
        env:
          TEST_BASE_URL: https://${{ env.NGROK_DOMAIN }}
        run: |
          python3 tests/api_test.py
          node tests/browser.cjs
      - name: Announce verified service and keep running
        run: |
          echo "Service verified: https://$NGROK_DOMAIN"
          echo "### Service verified: https://$NGROK_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo 'Browser uploads return preview and direct-download links. API uploads still return the original plain-text URL.' >> "$GITHUB_STEP_SUMMARY"
          end=$((SECONDS + RUNTIME_MINUTES * 60))
          while (( SECONDS < end )); do
            kill -0 "$(cat "$RUNNER_TEMP/transfer.pid")"
            kill -0 "$(cat "$RUNNER_TEMP/ngrok.pid")"
            curl -fsS http://127.0.0.1:8080/health.html > /dev/null
            echo "$(date -u +%FT%TZ) Service running; $(((end - SECONDS) / 60)) minutes remaining"
            sleep 60
          done
      - name: Cleanup
        if: always()
        run: |
          for name in transfer ngrok; do
            if test -f "$RUNNER_TEMP/$name.pid"; then kill "$(cat "$RUNNER_TEMP/$name.pid")" || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: transfer-host-logs
          path: |
            ${{ runner.temp }}/transfer.log
            ${{ runner.temp }}/ngrok.log
